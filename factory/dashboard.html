<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Factory</title>
<style>
  :root {
    --bg: #14151b;
    --panel: #1a1c24;
    --card: #20222c;
    --card-hover: #252835;
    --line: #2b2e3b;
    --text: #e4e5ea;
    --muted: #868ba0;
    --faint: #5b6075;
    --active: #8be9fd;
    --pass: #50fa7b;
    --changes: #ffb86c;
    --human: #ff5555;
    --merged: #bd93f9;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  /* Header */
  header {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    flex-wrap: wrap; padding: 28px 32px 8px;
  }
  h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .status { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .status .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--pass); margin-right: 6px; vertical-align: 1px;
  }
  .status.error { color: var(--human); }
  .hright { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .notify {
    background: var(--panel); border: 1px solid var(--line); color: var(--muted); border-radius: 99px;
    padding: 3px 12px; font-size: 12px; cursor: pointer;
  }
  .notify[aria-pressed="true"] { color: var(--text); border-color: var(--active); }
  .status.error .dot { background: var(--human); }
  .banner {
    margin: 12px 32px 0; padding: 10px 14px; border: 1px solid var(--human);
    border-radius: 8px; color: var(--human); font-family: var(--mono); font-size: 12px;
  }

  /* Board */
  .board {
    display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 12px;
    padding: 20px 32px 40px; align-items: start;
  }
  .col { min-width: 0; }
  .col-head {
    display: flex; align-items: center; gap: 8px; padding: 0 2px 10px;
    border-bottom: 1px solid var(--line); margin-bottom: 12px; position: relative;
  }
  .col-head h2 { margin: 0; font-size: 13px; font-weight: 600; }
  .col-head .who { font-size: 11px; color: var(--faint); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .col-head .count {
    margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted);
  }
  .col:not(:last-child):not(:nth-last-child(2)) .col-head::after {
    content: "›"; position: absolute; right: -10px; top: -2px; color: var(--faint); font-size: 16px;
  }
  .col.human .col-head { border-bottom-color: color-mix(in srgb, var(--human) 55%, transparent); }
  .col.human h2 { color: var(--human); }
  .col.merged-col h2 { color: var(--merged); }
  .empty { color: var(--faint); font-size: 12px; padding: 4px 2px; }

  /* Cards */
  .card {
    display: block; width: 100%; text-align: left; cursor: pointer; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 12px 10px; margin-bottom: 10px;
    transition: background .15s, border-color .15s, transform .15s;
  }
  .card:hover { background: var(--card-hover); transform: translateY(-1px); }
  .card:focus-visible { outline: 2px solid var(--active); outline-offset: 2px; }
  .card.live { border-color: color-mix(in srgb, var(--active) 35%, var(--line)); }
  .card.human {
    border-color: var(--human);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--human) 40%, transparent),
                0 8px 24px -12px color-mix(in srgb, var(--human) 60%, transparent);
  }
  .card.done { opacity: .72; }
  .card.rejected .feature { text-decoration: line-through; text-decoration-color: var(--faint); }
  .flag.wait { color: var(--changes); }
  .card-top { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 8px; margin-bottom: 4px; }
  .num { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .card-top .num { min-width: 0; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pulse {
    width: 7px; height: 7px; border-radius: 50%; background: var(--active);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .flag {
    margin-left: auto; font-size: 10px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--human); white-space: nowrap;
  }
  .feature { font-size: 13px; line-height: 1.4; margin: 0 0 6px; }
  .links { display: flex; gap: 6px; font-family: var(--mono); font-size: 11px; }
  .links { flex-wrap: wrap; }
  .links a {
    white-space: nowrap; flex: none; color: var(--active); text-decoration: none; padding: 1px 6px; border-radius: 99px;
    border: 1px solid color-mix(in srgb, var(--active) 40%, transparent);
  }
  .links a::after { content: ' ↗'; opacity: .7; }
  .links a:hover { background: color-mix(in srgb, var(--active) 16%, transparent); }
  .meta { display: flex; gap: 10px; margin-top: 8px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .meta .risk-high { color: var(--human); } .meta .risk-medium { color: var(--changes); }
  .chip.gate { flex: 0 0 38px; }
  .chip.FAIL { border: 1px solid transparent; color: var(--human); background: color-mix(in srgb, var(--human) 16%, transparent); }
  .branch {
    font-family: var(--mono); font-size: 11px; color: var(--faint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .rounds { margin-top: 10px; display: grid; gap: 5px; }
  .round { display: flex; align-items: center; gap: 4px; }
  .round .r { font-family: var(--mono); font-size: 10px; color: var(--faint); width: 20px; }
  .chip {
    flex: 1; text-align: center; font-family: var(--mono); font-size: 10px;
    padding: 2px 0; border-radius: 4px; border: 1px dashed var(--faint); color: var(--faint);
  }
  .chip.wait { animation: breathe 1.6s ease-in-out infinite; }
  .chip.PASS {
    border: 1px solid transparent; color: var(--pass);
    background: color-mix(in srgb, var(--pass) 14%, transparent);
  }
  .chip.CHANGES {
    border: 1px solid transparent; color: var(--changes);
    background: color-mix(in srgb, var(--changes) 16%, transparent);
  }
  .chip.bad { border: 1px solid var(--human); color: var(--human); }
  .mergelink {
    display: block; margin-bottom: 6px; padding: 5px 8px; border-radius: 6px; text-align: center;
    background: color-mix(in srgb, var(--human) 18%, transparent); color: var(--human);
    border: 1px solid color-mix(in srgb, var(--human) 55%, transparent); text-decoration: none; font-weight: 600;
  }
  .mergelink.ask {
    background: color-mix(in srgb, var(--changes) 16%, transparent); color: var(--changes);
    border-color: color-mix(in srgb, var(--changes) 55%, transparent);
  }
  .mergelink:hover { background: color-mix(in srgb, var(--human) 30%, transparent); }
  .hint {
    margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 10.5px; color: var(--muted); line-height: 1.6;
    overflow-wrap: anywhere;
  }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .pulse, .chip.wait { animation: none; } }

  /* Drawer */
  .scrim {
    position: fixed; inset: 0; background: rgba(5, 6, 10, .55);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(920px, 100vw);
    background: var(--panel); border-left: 1px solid var(--line);
    display: grid; grid-template-rows: auto 1fr; transform: translateX(100%);
    transition: transform .25s ease;
  }
  .open .scrim { opacity: 1; pointer-events: auto; }
  .open .drawer { transform: none; }
  .d-head { padding: 20px 24px 16px; border-bottom: 1px solid var(--line); position: relative; }
  .d-head .num { font-size: 12px; }
  .d-head h3 { margin: 4px 40px 6px 0; font-size: 16px; font-weight: 600; line-height: 1.35; }
  .close {
    position: absolute; top: 16px; right: 16px; width: 32px; height: 32px;
    border-radius: 8px; border: 1px solid var(--line); background: none; cursor: pointer;
    color: var(--muted); font-size: 18px; line-height: 1;
  }
  .close:hover { color: var(--text); border-color: var(--muted); }
  .d-body { display: grid; grid-template-columns: 200px 1fr; min-height: 0; }
  .files { border-right: 1px solid var(--line); padding: 14px 10px; overflow-y: auto; }
  .files .group {
    font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--faint); margin: 12px 8px 4px;
  }
  .files .group:first-child { margin-top: 0; }
  .file {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: none; border: 0; border-radius: 6px; padding: 5px 8px; cursor: pointer;
    font-family: var(--mono); font-size: 12px; color: var(--muted);
  }
  .file:hover { background: var(--card); color: var(--text); }
  .file.on { background: var(--card-hover); color: var(--text); }
  .file .rn { display: none; }
  .file .v { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
  .v.good { background: var(--pass); } .v.warn { background: var(--changes); } .v.stop { background: var(--human); }
  .doc { overflow-y: auto; padding: 22px 28px 60px; min-width: 0; }

  /* Rendered markdown */
  .md { max-width: 680px; line-height: 1.65; }
  .md h1, .md h2, .md h3, .md h4 { line-height: 1.3; margin: 1.6em 0 .5em; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 15px; } .md h3 { font-size: 14px; color: var(--muted); }
  .md > :first-child { margin-top: 0; }
  .md p, .md ul, .md ol, .md blockquote, .md pre, .md table { margin: 0 0 .9em; }
  .md ul, .md ol { padding-left: 1.3em; }
  .md li { margin: .2em 0; }
  .md li.task { list-style: none; margin-left: -1.3em; }
  .md li.task::before { content: "☐"; margin-right: .5em; color: var(--faint); }
  .md li.task.done::before { content: "☑"; color: var(--pass); }
  .md code {
    font-family: var(--mono); font-size: 12px; background: var(--card);
    padding: 1px 5px; border-radius: 4px;
  }
  .md pre {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; overflow-x: auto;
  }
  .md pre code { background: none; padding: 0; }
  .md blockquote { border-left: 2px solid var(--line); padding-left: 12px; color: var(--muted); }
  .md a { color: var(--active); }
  .md table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
  .verdict {
    display: inline-block; font-family: var(--mono); font-size: 12px; font-weight: 600;
    padding: 4px 10px; border-radius: 6px; margin-bottom: 14px;
  }
  .verdict + * { margin-top: .4em; }
  .md .head { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: -6px 0 14px; white-space: pre-line; }
  .verdict.good { color: var(--pass); background: color-mix(in srgb, var(--pass) 14%, transparent); }
  .verdict.warn { color: var(--changes); background: color-mix(in srgb, var(--changes) 16%, transparent); }
  .verdict.stop { color: var(--human); background: color-mix(in srgb, var(--human) 16%, transparent); }
  .note { color: var(--faint); font-size: 13px; }
  .md .summary {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 16px 4px; margin: 0 0 22px;
  }
  .md .summary h2 {
    margin: 0 0 6px; font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .08em; color: var(--muted);
  }
  .md .summary ul { margin: 0 0 .6em; }

  footer {
    padding: 0 32px 32px; font-family: var(--mono); font-size: 11px; color: var(--faint);
    display: flex; gap: 20px; flex-wrap: wrap;
  }



  /* Factory health: productivity, flow quality, agents, cost, vitality */
  #health { padding: 6px 32px 0; }
  #health.closed .hl-body { display: none; }
  #health .caret { transition: transform .15s; display: inline-block; color: var(--faint); }
  #health.closed .caret { transform: rotate(-90deg); }
  .hl-chips { display: none; gap: 6px; flex-wrap: wrap; padding: 2px 0 10px; font-family: var(--mono); font-size: 11px; }
  #health.closed .hl-chips { display: flex; }
  .hl-chip { border: 1px solid var(--line); border-radius: 99px; padding: 1px 9px; color: var(--muted); }
  .hl-chip b { margin-left: 4px; font-weight: 650; }
  .hl-chip.good b { color: var(--pass); } .hl-chip.watch b { color: var(--changes); } .hl-chip.bad b { color: var(--human); }
  .hl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; align-items: start; margin-bottom: 12px; }
  .hl-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .hl-card h3 { margin: 0 0 2px; font-size: 12px; font-weight: 650; }
  .hl-card .q { font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin-bottom: 6px; }
  .kpi { display: grid; grid-template-columns: 10px 1fr auto auto; gap: 8px; align-items: baseline; padding: 3px 0; font-family: var(--mono); font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); }
  .kpi:first-of-type { border-top: 0; }
  .kpi .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--faint); align-self: center; }
  .kpi.good .dot { background: var(--pass); } .kpi.watch .dot { background: var(--changes); } .kpi.bad .dot { background: var(--human); }
  .kpi b { color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums; }
  .kpi em { font-style: normal; font-size: 10px; color: var(--faint); }
  .hl-trends { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .trend { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .trend b { color: var(--text); margin-left: 6px; }
  .trend svg { width: 100%; height: 38px; display: block; margin-top: 4px; }
  .timebar { display: flex; height: 16px; border-radius: 6px; overflow: hidden; background: var(--line); margin: 6px 0 4px; }
  .timebar i { display: block; height: 100%; }
  .timelegend { display: flex; gap: 10px; flex-wrap: wrap; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .timelegend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; background: var(--c); }
  .hl-sec h3 { margin: 10px 0 6px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .attn { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .attn a { color: var(--active); text-decoration: none; }
  .attn div { padding: 2px 0; }
  @media (max-width: 720px) { #health { padding-left: 16px; padding-right: 16px; } }

  /* Evolution board: how each skill changed, and whether it helped */
  #evolution { padding: 6px 32px 0; }
  #evolution.closed .evo-body { display: none; }
  #evolution .ag-head .caret { transition: transform .15s; }
  #evolution.closed .caret { transform: rotate(-90deg); }
  .evo-chips { display: none; gap: 6px; flex-wrap: wrap; align-items: center; padding: 2px 0 10px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  #evolution.closed .evo-chips { display: flex; }
  .evo-sec { margin: 4px 0 14px; }
  .evo-sec h3 { margin: 10px 0 6px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .evo-trend { display: grid; grid-template-columns: minmax(260px, 420px) 1fr; gap: 18px; align-items: center; }
  .evo-trend svg { width: 100%; height: 110px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .evo-table { font-family: var(--mono); font-size: 11px; color: var(--muted); border-collapse: collapse; }
  .evo-table td, .evo-table th { padding: 2px 12px 2px 0; text-align: left; font-weight: 400; white-space: nowrap; }
  .evo-table th { color: var(--faint); }
  .evo-skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; align-items: start; }
  .evo-skill { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .evo-skill .ag-top .ver { margin-left: auto; font-family: var(--mono); font-size: 13px; color: var(--text); }
  .evo-line { display: flex; gap: 5px; flex-wrap: wrap; margin: 8px 0 2px; }
  .vchip { font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--line); border-radius: 99px; padding: 0 8px; cursor: pointer; color: var(--muted); background: none; }
  .vchip.change { color: var(--active); border-color: color-mix(in srgb, var(--active) 45%, transparent); }
  .vchip.rollback { color: var(--changes); border-color: color-mix(in srgb, var(--changes) 45%, transparent); }
  .vchip.external_edit { color: var(--human); border-color: color-mix(in srgb, var(--human) 45%, transparent); }
  .vchip.on { background: var(--card-hover); color: var(--text); }
  .evo-detail { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.55; }
  .evo-detail pre { margin: 6px 0 0; padding: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; max-height: 220px; overflow: auto; font-size: 10.5px; white-space: pre-wrap; }
  .evo-detail .add { color: var(--pass); } .evo-detail .del { color: var(--human); }
  .spark { width: 100%; height: 34px; margin-top: 6px; }
  .evo-audit { width: 100%; }
  .evo-row { display: grid; grid-template-columns: 90px 150px 1fr auto; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 11px; color: var(--muted); align-items: start; }
  .evo-row .sum { color: var(--text); font-family: inherit; }
  .stages { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
  .stg { border: 1px solid var(--line); border-radius: 99px; padding: 0 7px; font-size: 10.5px; color: var(--faint); }
  .stg.proposed { color: var(--muted); } .stg.approved, .stg.deployed, .stg.delivered { color: var(--pass); border-color: color-mix(in srgb, var(--pass) 45%, transparent); }
  .stg.rejected, .stg.regressed, .stg.rolled_back { color: var(--human); border-color: color-mix(in srgb, var(--human) 45%, transparent); }
  .stg.not_delivered, .stg.inconclusive { color: var(--changes); border-color: color-mix(in srgb, var(--changes) 45%, transparent); }
  .evo-filter { font-family: var(--mono); font-size: 11px; background: var(--card); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; margin-left: 8px; }
  @media (max-width: 720px) { #evolution { padding-left: 16px; padding-right: 16px; } .evo-trend { grid-template-columns: 1fr; } .evo-row { grid-template-columns: 1fr; } .stages { justify-content: flex-start; } }

  /* Agent confidence: one card per agent, two composite metrics behind the score */
  #agents { padding: 6px 32px 0; }
  .ag-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; cursor: pointer; padding: 6px 0; }
  .ag-head h2 { margin: 0; font-size: 15px; font-weight: 650; }
  .ag-head .sub { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .ag-head .caret { color: var(--faint); transition: transform .15s; display: inline-block; }
  #agents.closed .caret { transform: rotate(-90deg); }
  #agents.closed .ag-grid, #agents.closed .ag-legend { display: none; }
  .ag-chips { display: none; gap: 6px; flex-wrap: wrap; padding: 2px 0 10px; font-family: var(--mono); font-size: 11px; }
  #agents.closed .ag-chips { display: flex; }
  .ag-chip { border: 1px solid var(--line); border-radius: 99px; padding: 1px 9px; color: var(--muted); }
  .ag-chip b { font-weight: 650; margin-left: 4px; }
  .ag-chip.pass b { color: var(--pass); } .ag-chip.active b { color: var(--active); } .ag-chip.changes b { color: var(--changes); }
  .ag-legend { font-family: var(--mono); font-size: 11px; color: var(--muted); margin: 2px 0 10px; line-height: 1.6; }
  .ag-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; padding-bottom: 6px; align-items: start; }
  .acard {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer;
  }
  .acard:hover { background: var(--card-hover); }
  .ag-top { display: flex; align-items: center; gap: 10px; }
  .ag-name { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .ag-score { margin-left: auto; font-size: 26px; font-weight: 650; line-height: 1; font-variant-numeric: tabular-nums; }
  .ag-score.pass { color: var(--pass); } .ag-score.active { color: var(--active); }
  .ag-score.changes { color: var(--changes); } .ag-score.none { color: var(--faint); font-size: 14px; }
  .ag-tags { display: flex; gap: 6px; margin: 6px 0 8px; font-family: var(--mono); font-size: 10.5px; color: var(--faint); flex-wrap: wrap; }
  .ag-tag { border: 1px solid var(--line); border-radius: 99px; padding: 0 7px; }
  .ag-tag.pass { color: var(--pass); border-color: color-mix(in srgb, var(--pass) 45%, transparent); }
  .ag-tag.active { color: var(--active); border-color: color-mix(in srgb, var(--active) 45%, transparent); }
  .ag-tag.changes { color: var(--changes); border-color: color-mix(in srgb, var(--changes) 45%, transparent); }
  .ag-bar { display: grid; grid-template-columns: 54px 1fr 34px; gap: 8px; align-items: center; font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 4px; }
  .ag-bar .track { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .ag-bar .fill { display: block; height: 100%; border-radius: 99px; background: var(--active); }
  .ag-bar .fill.pass { background: var(--pass); } .ag-bar .fill.changes { background: var(--changes); } .ag-bar .fill.bad { background: var(--human); }
  .ag-bar b { color: var(--text); font-weight: 600; text-align: right; }
  .ag-detail { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
  .ag-detail h4 { margin: 8px 0 2px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .acard.open { grid-column: span 2; }
  .ag-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 22px; }
  .ag-detail .ag-bar { grid-template-columns: 150px 1fr 28px; }
  .ag-detail .ag-bar em { font-style: normal; color: var(--faint); font-size: 9.5px; margin-left: 4px; }
  .ag-detail .ag-bar.na { opacity: .55; }
  .ag-note { font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin-top: 6px; line-height: 1.5; }
  .ag-empty { font-family: var(--mono); font-size: 12px; color: var(--faint); padding: 4px 0 10px; }

  /* Swimlanes: one band per project, columns named once in a sticky row */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 32px 0; }
  .fchip {
    background: var(--panel); border: 1px solid var(--line); color: var(--muted);
    border-radius: 99px; padding: 3px 12px; font-size: 12px; cursor: pointer;
  }
  .fchip[aria-pressed="true"] { color: var(--text); border-color: var(--active); }
  .fchip .n { font-family: var(--mono); margin-left: 6px; color: var(--faint); }
  .fchip.alert .n { color: var(--human); }
  .colhead {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 12px;
    padding: 14px 32px 0; border-bottom: 1px solid var(--line); margin-top: 12px;
  }
  .colhead .col-head { margin-bottom: 0; border-bottom: 0; padding-bottom: 10px; }
  .lane { margin: 18px 0 0; border-top: 1px solid var(--line); }
  .lane-head {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 32px 0; width: 100%; background: none; border: 0; text-align: left; cursor: pointer;
  }
  .lane-head .caret { color: var(--faint); transition: transform .15s; display: inline-block; }
  .lane.closed .caret { transform: rotate(-90deg); }
  .lane-head .name { font-size: 15px; font-weight: 650; }
  .lane-head .repo { font-family: var(--mono); font-size: 12px; color: var(--muted); text-decoration: none; }
  .lane-head .repo:hover { color: var(--active); text-decoration: underline; }
  .lane-head .stats { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted); display: flex; gap: 14px; }
  .lane-head .stats .alert { color: var(--human); font-weight: 600; }
  .lane.closed .board { display: none; }
  .lane .board { padding-top: 14px; padding-bottom: 22px; }
  .lane .col-head { display: none; }
  .lane-empty { color: var(--faint); font-size: 12px; padding: 14px 32px 20px; }
  .more {
    margin-top: 8px; width: 100%; background: none; border: 1px dashed var(--line); color: var(--muted);
    border-radius: 8px; padding: 6px 8px; font-size: 12px; cursor: pointer;
  }
  .more:hover { color: var(--text); border-color: var(--active); }
  /* Cumulative cost of a project, spread per step and per agent */
  .cost { padding: 10px 32px 0; }
  .costbar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--line); }
  .costbar i { display: block; height: 100%; min-width: 2px; }
  .costlegend { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 8px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .costlegend .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  .costlegend b { color: var(--text); font-weight: 600; }
  .costlegend .ag { color: var(--faint); margin-left: 6px; }
  .costnone { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .lane.unknown .name { color: var(--human); }

  @media (max-width: 1100px) {
    .colhead { display: none; }
    .lane .col-head { display: flex; }
    .board { grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 28px; }
    .col-head::after { display: none; }
  }
  @media (max-width: 640px) {
    header { padding: 20px 16px 4px; }
    .banner { margin: 12px 16px 0; }
    .board { grid-template-columns: 1fr; padding: 16px 16px 32px; }
    .filters, .lane-head, .lane-empty, .cost, #agents { padding-left: 16px; padding-right: 16px; }
    .acard.open { grid-column: auto; } .ag-cols { grid-template-columns: 1fr; }
    footer { padding: 0 16px 24px; }
    .d-head { padding: 16px; }
    .d-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .files {
      border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 4px;
      overflow-x: auto; padding: 8px;
    }
    .files .group { display: none; }
    .file { width: auto; white-space: nowrap; }
    .file .rn { display: inline; white-space: pre; }
    .doc { padding: 18px 16px 48px; }
  }
</style>
</head>
<body>
<header>
  <h1>Software factory</h1>
  <div class="hright">
    <button class="notify" id="notify" type="button" hidden aria-pressed="false" title="Notify me when a job needs me">🔔 Notify me</button>
    <div class="status" id="status">connecting…</div>
  </div>
</header>
<div id="banner"></div>
<section id="health" aria-label="Factory health"></section>
<section id="agents" aria-label="Agent confidence"></section>
<section id="evolution" aria-label="Evolution board"></section>
<div class="filters" id="filters"></div>
<div class="colhead" id="colhead"></div>
<main id="lanes"></main>
<footer>
  <span>/factory run</span>
  <span>/factory run &lt;target&gt;</span>
  <span>/factory run &lt;target&gt;#&lt;n&gt;</span>
  <span>/factory &lt;anything&gt;</span>
  <span id="totals"></span>
</footer>

<div id="overlay">
  <div class="scrim" data-close></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title">
    <div class="d-head">
      <div class="num" id="d-num"></div>
      <h3 id="d-title"></h3>
      <div class="links" id="d-links"></div>
      <button class="close" data-close aria-label="Close">×</button>
    </div>
    <div class="d-body">
      <nav class="files" id="d-files"></nav>
      <article class="doc"><div class="md" id="d-doc"></div></article>
    </div>
  </aside>
</div>

<script>
const POLL_MS = 2000
const DONE_LIMIT = 5 // finished jobs shown per lane until the lane is expanded
const COLUMNS = [
  { label: 'Intake', who: 'intake · opus', stages: ['intake', 'needs-info'] },
  { label: 'Spec', who: 'spec-writer · opus', stages: ['spec'] },
  { label: 'Build', who: 'builder · gate', stages: ['build', 'gate'] },
  { label: 'Review', who: 'routed reviewers', stages: ['review'] },
  { label: 'Approve', who: 'approver · merge', stages: ['approve', 'merging'] },
  { label: 'Needs human', who: 'you', stages: ['needs-human'], cls: 'human' },
  { label: 'Done', who: 'merged · rejected', stages: ['merged', 'rejected'], cls: 'merged-col' },
]
const STAGES = new Set(COLUMNS.flatMap((c) => c.stages))
const LIVE = new Set(['intake', 'spec', 'build', 'gate', 'review', 'approve', 'merging'])
const SHORT = { code: 'code', ux: 'ux', ui: 'ui', security: 'sec' }

const $ = (id) => document.getElementById(id)
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])

let jobs = []
let targets = {} // name -> { repo, ... } from config.json
let overhead = 0 // dollars of orchestration while no job was running (jobs/_orchestration.json)
let lastRender = ''
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem('factory.' + k)) ?? d } catch { return d } },
  set(k, v) { try { localStorage.setItem('factory.' + k, JSON.stringify(v)) } catch {} },
}
let closedLanes = new Set(store.get('closed', []))
let onlyLane = store.get('only', null)
let showAllDone = new Set(store.get('allDone', []))
let scores = null // evals/scores.json: the confidence of every agent
let metrics = null // metrics.json: the factory's health numbers (written by factory/bin/metrics)
let healthClosed = store.get('healthClosed', true)
let board = null // evolution/board.json: versions of every skill, cycles, audit trail (written by factory/bin/evolve)
let evoClosed = store.get('evoClosed', true)
let openVersions = new Set(store.get('openVersions', [])) // "<skill>@<version>"
let evoFilter = store.get('evoFilter', 'all')
let openAgents = new Set(store.get('openAgents', []))
let agentsClosed = store.get('agentsClosed', true)
let notifyOn = store.get('notify', false) && typeof Notification !== 'undefined' && Notification.permission === 'granted'
let knownHuman = null // ids of the jobs that needed a human at the last poll (null before the first poll)
const roundCache = new Map() // "<job>/<n>" -> verdicts of a finished round
let openJobId = null
let openPath = null
let openText = null

async function fetchText(url) {
  const res = await fetch(url, { cache: 'no-store' })
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`)
  return res.text()
}

async function fetchFirst(url) {
  try { return (await fetchText(url)).split('\n')[0].trim() } catch { return null }
}

// ---- Board ---------------------------------------------------------------

function verdictOf(line) {
  if (line === null) return 'pending'
  const m = line.match(/^(?:VERDICT|GATE):\s*(PASS|CHANGES|FAIL)$/)
  return m ? m[1] : 'invalid'
}

// A round's verdicts come from its files: the gate first, then each routed reviewer.
async function roundVerdicts(job, n) {
  const key = `${job.id}/${n}`
  if (roundCache.has(key)) return roundCache.get(key)
  const dir = `jobs/${job.id}/round-${n}/`
  const v = { gate: verdictOf(await fetchFirst(dir + 'checks.md')), reviews: {} }
  if (v.gate === 'PASS') {
    await Promise.all(Object.keys(job.agents?.reviewers || {}).map(async (r) => {
      v.reviews[r] = verdictOf(await fetchFirst(`${dir}review-${r}.md`))
    }))
  }
  const settled = v.gate === 'FAIL' || (v.gate === 'PASS' && Object.values(v.reviews).every((x) => x === 'PASS' || x === 'CHANGES'))
  // A round is final once a later round exists, or once the job itself is over (merged or rejected).
  if (settled && (n < job.round || job.stage === 'merged' || job.stage === 'rejected')) roundCache.set(key, v)
  return v
}

function chip(label, v, waiting, title, extra = '') {
  const cls = ['PASS', 'CHANGES', 'FAIL'].includes(v) ? v : v === 'pending' ? (waiting ? 'wait' : '') : 'bad'
  return `<span class="chip ${extra} ${cls}" title="${esc(title)}: ${esc(v)}">${esc(label)}</span>`
}

function roundRow(job, n, v) {
  const current = n === job.round
  const cells = [chip('gate', v.gate, current && job.stage === 'gate', 'gate', 'gate')]
  if (v.gate === 'PASS') {
    for (const r of Object.keys(job.agents.reviewers)) {
      cells.push(chip(SHORT[r] || r, v.reviews[r], current && job.stage === 'review', r))
    }
  }
  return `<div class="round"><span class="r">R${n}</span>${cells.join('')}</div>`
}

function elapsed(job) {
  const end = job.ended ? new Date(job.ended) : new Date()
  const min = Math.max(0, Math.floor((end - new Date(job.started)) / 60000))
  return min >= 60 ? `${Math.floor(min / 60)}h${String(min % 60).padStart(2, '0')}m` : `${min}m`
}

// The example jobs keep their issue and PR numbers but have no URLs.
const link = (url, text) =>
  url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${text}</a>` : `<span>${text}</span>`

function links(job) {
  const out = [link(job.issue_url, `issue #${job.issue}`)]
  if (job.pr) out.push(link(job.pr_url, `PR #${job.pr}`))
  return out.join('')
}

function card(job, rounds) {
  const live = LIVE.has(job.stage)
  const human = job.stage === 'needs-human'
  const done = job.stage === 'merged' || job.stage === 'rejected'
  const [num, ...slug] = job.id.split('-')
  const flag = human ? '<span class="flag">your call</span>'
    : job.stage === 'needs-info' ? '<span class="flag wait">asked author</span>'
    : job.stage === 'rejected' ? '<span class="flag wait">rejected</span>' : ''
  const risk = job.intake?.risk
  const meta = [
    risk ? `<span class="risk-${esc(risk)}">${esc(risk)}</span>` : '',
    `<span title="${esc(Object.entries(job.cost_by_agent || {}).map(([a, c]) => agentLabel(a) + ' ' + money(Number(c))).join(' · '))}">${money(Number(job.cost_usd))}</span>`,
    `<span>${elapsed(job)}</span>`,
  ].join('')
  return `
    <article class="card ${live ? 'live' : ''} ${human ? 'human' : ''} ${done ? 'done' : ''} ${job.stage}"
             data-job="${esc(job.id)}" tabindex="0" title="${esc(job.id)}: ${esc(job.title)}">
      <div class="card-top">
        ${live ? '<span class="pulse" aria-label="running"></span>' : ''}
        <span class="num">${esc(num)} · ${esc(slug.join('-'))}</span>
        ${flag}
      </div>
      <p class="feature">${esc(job.title)}</p>
      <div class="links">${links(job)}</div>
      ${rounds.length ? `<div class="rounds">${rounds.join('')}</div>` : ''}
      <div class="meta">${meta}</div>
      ${job.stage === 'needs-info' && job.issue_url ? `<div class="hint"><a class="mergelink ask" href="${esc(job.issue_url)}" target="_blank" rel="noopener">Open issue #${job.issue} to answer ↗</a></div>` : ''}
      ${human ? `<div class="hint">${job.pr_url ? `<a class="mergelink" href="${esc(job.pr_url)}" target="_blank" rel="noopener">Open PR #${job.pr} to merge ↗</a>`
        : job.pr ? `merge PR #${job.pr} to approve<br>` : ''}or give feedback: /factory &lt;anything&gt;</div>` : ''}
    </article>`
}

// ---- Agent confidence --------------------------------------------------------
const AGENT_ORDER = ['intake', 'spec-writer', 'builder', 'reviewer-code', 'reviewer-ux', 'reviewer-ui', 'reviewer-security', 'approver', 'retrospective']
const nice = (k) => k.replace(/_/g, ' ').replace(/^./, (c) => c.toUpperCase())
const labelTone = (l) => l === 'trusted' ? 'pass' : l === 'ok' ? 'active' : l === 'watch' ? 'changes' : ''
const barTone = (v) => v >= 85 ? 'pass' : v >= 70 ? '' : v >= 50 ? 'changes' : 'bad'
const bar = (label, v, help) => v == null ? '' :
  `<div class="ag-bar" title="${esc(help || '')}"><span>${esc(label)}</span><span class="track"><i class="fill ${barTone(v)}" style="width:${Math.max(2, Math.min(100, v))}%"></i></span><b>${Math.round(v)}</b></div>`
const KIND = { rule: 'rule', outcome: 'outcome', judge: 'judge' }
function critRow(c) {
  const src = (c.sources || []).map((id) => (scores.sources?.[id]?.title || id)).join('; ')
  const help = `${c.description}\nMeasured: ${c.measure}\nWeight ${c.weight} · ${c.kind} · ${c.basis === 'source' ? 'based on: ' + (src || 'a source') : 'inference (no source)'}\n${c.n} sample${c.n === 1 ? '' : 's'}`
  const v = c.score
  return `<div class="ag-bar ${v == null ? 'na' : ''}" title="${esc(help)}"><span>${esc(c.label)} <em>${KIND[c.kind] || c.kind}${c.basis === 'source' ? ' ·src' : ''}</em></span>` +
    `<span class="track">${v == null ? '' : `<i class="fill ${barTone(v)}" style="width:${Math.max(2, Math.min(100, v))}%"></i>`}</span><b>${v == null ? '–' : Math.round(v)}</b></div>`
}

function agentCard(name, a) {
  const open = openAgents.has(name)
  const tone = labelTone(a.label)
  const n = a.samples || { live: 0, eval: 0 }
  const metrics = (kind) => (a[kind].criteria || []).map(critRow).join('')
  const models = Object.entries(a.by_model || {}).map(([m, d]) => `${esc(m.replace('claude-', ''))} ${d.confidence == null ? '-' : Math.round(d.confidence)} (${d.samples})`).join(' · ')
  const detail = open ? `
    <div class="ag-detail">
      <div class="ag-note">${esc(a.role || '')}</div>
      <div class="ag-cols"><div><h4>Process · how it works</h4>${metrics('process')}</div>
      <div><h4>Output · how good it is</h4>${metrics('output')}</div></div>
      <div class="ag-note">– = no evidence yet · judge criteria need a verdict (/factory eval) · hover a row for its definition, measure and sources</div>
      ${models ? `<div class="ag-note">by model: ${models}</div>` : ''}
    </div>` : ''
  return `
    <article class="acard ${open ? 'open' : ''}" data-agent="${esc(name)}" tabindex="0" aria-expanded="${open}">
      <div class="ag-top">
        <span class="ag-name">${esc(name)}</span>
        <span class="ag-score ${a.confidence == null ? 'none' : tone}">${a.confidence == null ? 'no data' : Math.round(a.confidence)}</span>
      </div>
      <div class="ag-tags">
        ${a.label ? `<span class="ag-tag ${tone}">${esc(a.label)}</span>` : ''}
        ${a.provisional && a.confidence != null ? '<span class="ag-tag">provisional</span>' : ''}
        <span>${n.live} live · ${n.eval} eval</span>
      </div>
      ${bar('Process', a.process.score, 'how the agent works')}
      ${bar('Output', a.output.score, 'how good what it produced is')}
      ${detail}
    </article>`
}

let lastAgents = ''
function renderAgents() {
  const el = $('agents')
  let html
  if (!scores || !scores.agents) {
    html = '<div class="ag-head"><span class="caret">▾</span><h2>Agent confidence</h2></div>' +
      '<div class="ag-empty">No scores yet. Run <code>factory/bin/eval report</code> (it also runs at the end of /factory run).</div>'
  } else {
    const w = scores.settings?.weights || { process: 0.4, output: 0.6 }
    const t = scores.settings?.thresholds || { trusted: 85, ok: 70 }
    html = `<div class="ag-head" data-agents-toggle><span class="caret">▾</span><h2>Agent confidence</h2>
        <span class="sub">process ${Math.round(w.process * 100)}% + output ${Math.round(w.output * 100)}% · trusted ≥ ${t.trusted}, ok ≥ ${t.ok} · updated ${esc((scores.updated || '').slice(11, 16))} UTC</span></div>
      <div class="ag-legend">Process = how an agent works. Output = how good its work is. Each agent is judged on criteria written for its own assignment (open a card; hover a row for its definition, how it is measured and its sources). Little evidence pulls the score toward a neutral value, so a new agent is “provisional”.</div>
      <div class="ag-chips" data-agents-toggle title="Click to expand">${AGENT_ORDER.filter((a) => scores.agents[a]).map((a) => { const r = scores.agents[a]; return `<span class="ag-chip ${labelTone(r.label)}">${esc(a)}<b>${r.confidence == null ? '–' : Math.round(r.confidence)}</b></span>` }).join('')}</div>
      <div class="ag-grid">${AGENT_ORDER.filter((a) => scores.agents[a]).map((a) => agentCard(a, scores.agents[a])).join('')}</div>`
  }
  const key = html + agentsClosed
  if (key !== lastAgents) {
    lastAgents = key
    el.className = agentsClosed ? 'closed' : ''
    el.innerHTML = html
  }
}

document.addEventListener('click', (e) => {
  if (e.target.closest('[data-agents-toggle]')) {
    agentsClosed = !agentsClosed; store.set('agentsClosed', agentsClosed); lastAgents = ''; renderAgents(); return
  }
  const card = e.target.closest('.acard')
  if (card) {
    const n = card.dataset.agent
    openAgents.has(n) ? openAgents.delete(n) : openAgents.add(n)
    store.set('openAgents', [...openAgents]); lastAgents = ''; renderAgents()
  }
})
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.acard')) { e.preventDefault(); e.target.click() }
})


// ---- Factory health ------------------------------------------------------

const hrs = (v) => v == null ? '–' : v < 1 ? `${Math.round(v * 60)} min` : v < 48 ? `${v.toFixed(1)} h` : `${(v / 24).toFixed(1)} d`
const pc = (v) => v == null ? '–' : `${Math.round(v * 100)}%`
const num = (v, d = 1) => v == null ? '–' : Number(v).toFixed(d).replace(/\.0+$/, '')
const usd = (v) => v == null ? '–' : `$${Number(v).toFixed(v < 1 ? 3 : 2)}`
const KPI = {
  throughput_7d: ['Merged this week', num, 'Jobs merged in the last 7 days.'],
  lead_time_p50_h: ['Lead time (median)', hrs, 'From the job starting to its merge, median of merged jobs, including the time a person took.'],
  cycle_efficiency: ['Hands-off share of lead time', pc, 'Share of lead time when the factory, not a person or an author, held the job. Low means jobs wait for people.'],
  first_pass_yield: ['First-pass yield', pc, 'Merged jobs that needed only one build round: right the first time.'],
  avg_rounds: ['Rounds per job', (v) => num(v, 2), 'Average build rounds of merged jobs. Each extra round is rework.'],
  autonomy: ['Autonomy', pc, 'Merged jobs that no human had to touch (approver said APPROVE, the factory merged).'],
  escalation_rate: ['Escalation rate', pc, 'Accepted jobs that ended up needing a human.'],
  agent_confidence: ['Average agent confidence', (v) => num(v, 0), 'Mean confidence score of the agents that have one (see Agent confidence).'],
  weakest_agent: ['Weakest agent', (v) => num(v, 0), 'The lowest confidence among the agents: where to look first.'],
  eval_pass_rate: ['Eval cases passing', pc, 'Share of eval cases whose latest run passed.'],
  cost_per_merged_job_usd: ['Cost per merged job', usd, 'API-equivalent cost of the merged jobs, orchestrator share included.'],
  waste_share: ['Cost of jobs not merged', pc, 'Share of spend on jobs that were rejected: money that delivered nothing.'],
  overhead_share: ['Orchestrator overhead', pc, 'Orchestrator spend while no job was running, as a share of all spend.'],
  stuck_jobs: ['Stuck jobs', (v) => num(v, 0), 'Jobs waiting longer than their limit (a person: 24 h, an author: 72 h, a running stage: 4 h).'],
  idle_days: ['Idle for', (v) => v == null ? '–' : v < 1 ? 'today' : `${num(v)} d`, 'Time since any job last changed stage: is the factory being used?'],
  change_delivery_rate: ['Changes that delivered', pc, 'Of the approved skill changes that could be measured, how many delivered the expected improvement.'],
  security_lens_fire_rate: ['Security review rate', pc, 'Reviewed jobs where the security reviewer ran (intake rated it, or the diff touched a sensitive path). Never running means the lens is never exercised.'],
  browser_tool_available: ['Shared browser tool', (v) => v == null ? '–' : v ? 'yes' : 'missing', 'agent-browser or factory/bin/browse is available, so agents do not each write their own browser script.'],
  cycles_with_zero_jobs: ['Empty cycles', (v) => num(v, 0), 'Cycles closed without any job: a cycle closed too early or opened by mistake.'],
}
const GROUPS = [
  ['Productivity', 'How much gets done, and how fast?', ['throughput_7d', 'lead_time_p50_h', 'cycle_efficiency']],
  ['Flow quality', 'How clean is the flow?', ['first_pass_yield', 'avg_rounds', 'autonomy', 'escalation_rate']],
  ['Agents', 'How good are the agents?', ['agent_confidence', 'weakest_agent', 'eval_pass_rate', 'security_lens_fire_rate', 'browser_tool_available']],
  ['Cost', 'What does delivery cost?', ['cost_per_merged_job_usd', 'waste_share', 'overhead_share']],
  ['Vitality', 'Is it alive and learning?', ['stuck_jobs', 'idle_days', 'change_delivery_rate', 'cycles_with_zero_jobs']],
]
const HEADLINE = ['throughput_7d', 'lead_time_p50_h', 'first_pass_yield', 'autonomy', 'agent_confidence', 'cost_per_merged_job_usd', 'stuck_jobs']
const STAGE_COLOR = { intake: '#8be9fd', spec: '#bd93f9', build: '#50fa7b', gate: '#f1fa8c', review: '#ffb86c', approve: '#ff79c6', merging: '#6272a4', 'needs-human': '#ff5555', 'needs-info': '#ff9580' }

function kpiRow(k) {
  const v = metrics.kpis[k]
  if (!v) return ''
  const [label, f, help] = KPI[k]
  const tgt = `${v.higher_is_better ? '≥' : '≤'} ${f === pc ? pc(v.target) : f === hrs ? hrs(v.target) : f(v.target)}`
  return `<div class="kpi ${esc(v.status)}" title="${esc(help)}\nTarget ${esc(tgt)} (factory/config.json, metrics.targets)"><span class="dot"></span><span>${esc(label)}</span><b>${esc(f(v.value))}</b><em>${esc(tgt)}</em></div>`
}

function miniSpark(vals) {
  const pts = vals.map((v, i) => ({ v, i })).filter((p) => p.v != null)
  if (!pts.length) return '<svg viewBox="0 0 160 38"></svg>'
  const lo = Math.min(...pts.map((p) => p.v), 0), hi = Math.max(...pts.map((p) => p.v), lo + 1e-9)
  const x = (i) => 4 + 152 * (i / Math.max(vals.length - 1, 1)), y = (v) => 34 - 30 * ((v - lo) / (hi - lo))
  const line = pts.length > 1 ? `<polyline points="${pts.map((p) => `${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--muted)" stroke-width="1.5"/>` : ''
  return `<svg viewBox="0 0 160 38" preserveAspectRatio="none">${line}${pts.map((p) => `<circle cx="${x(p.i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="2.2" fill="var(--text)"><title>${esc(String(p.v))}</title></circle>`).join('')}</svg>`
}

let lastHealth = ''
function renderHealth() {
  const el = $('health')
  let html
  if (!metrics) {
    html = '<div class="ag-head"><span class="caret">▾</span><h2>Factory health</h2></div><div class="ag-empty">No numbers yet: <code>factory/bin/metrics write</code> (it also runs after every job change).</div>'
  } else {
    const k = metrics.kpis, p = metrics.productivity, c = metrics.cost, v = metrics.vitality, a = metrics.agents, L = v.learning

    const head = `<div class="ag-head" data-health-toggle><span class="caret">▾</span><h2>Factory health</h2>
      <span class="sub">last ${metrics.window_days} days · ${bad} to fix · ${watch} to watch · as of ${esc((metrics.generated || '').slice(11, 16))} UTC</span></div>`
    const chips = `<div class="hl-chips" data-health-toggle title="Click to expand">${HEADLINE.filter((x) => k[x]).map((x) => `<span class="hl-chip ${esc(k[x].status)}">${esc(KPI[x][0])}<b>${esc(KPI[x][1](k[x].value))}</b></span>`).join('')}</div>`
    const cards = GROUPS.map(([t, q, keys]) => `<div class="hl-card"><h3>${esc(t)}</h3><div class="q">${esc(q)}</div>${keys.map(kpiRow).join('')}</div>`).join('')
    const S = metrics.series
    const trends = [['Merged / week', S.throughput, (x) => num(x, 0)], ['Lead time p50', S.lead_time_p50_h, hrs], ['First-pass yield', S.first_pass_yield, pc],
      ['Escalation rate', S.escalation_rate, pc], ['Cost / merged job', S.cost_per_merged_job_usd, usd]]
    const trendHtml = trends.map(([t, vals, f]) => { const last = [...vals].reverse().find((x) => x != null); return `<div class="trend">${esc(t)}<b>${esc(f(last))}</b>${miniSpark(vals)}<span style="color:var(--faint)">${esc(S.weeks[0])} → ${esc(S.weeks[S.weeks.length - 1])}</span></div>` }).join('')
    const sm = p.stage_avg_h || {}

      <div class="timelegend">${Object.entries(sm).filter(([, x]) => x).map(([st, x]) => `<span style="--c:${STAGE_COLOR[st] || '#888'}">${esc(st)} ${esc(hrs(x))}</span>`).join('')}</div>` : '<div class="ag-note">Stage times appear once jobs run with the stage history (new jobs).</div>'
    const stuck = v.stuck.length ? v.stuck.map((s) => `<div>⏳ <a href="${esc(s.url || '#')}" target="_blank" rel="noopener">${esc(s.job)}</a> (${esc(s.target || '')}) ${esc(s.stage)} for ${esc(hrs(s.hours))}, limit ${esc(hrs(s.limit_h))}</div>`).join('') : '<div>Nothing is stuck.</div>'
    const weak = a.weakest ? `<div>🎯 Weakest agent: <b>${esc(a.weakest.agent)}</b> at ${esc(num(a.weakest.confidence, 0))}. ${a.provisional} agent(s) provisional, ${a.eval_cases_run}/${a.eval_cases} eval cases run${a.last_eval_age_days != null ? `, last ${esc(num(a.last_eval_age_days))} d ago` : ''}.</div>` : ''
    const learn = `<div>🔁 Learning loop: ${L.cycles} cycle(s), ${L.proposed} change(s) proposed, ${L.approved} approved, ${L.rejected} rejected, ${L.delivered} delivered, ${L.regressed} regressed${L.last_cycle_age_days != null ? `; last retrospective ${esc(num(L.last_cycle_age_days))} d ago` : ''}.</div>`

const skillName = (id) => id.startsWith('agent:') ? id.slice(6) : id === 'skill:factory' ? 'orchestrator' : id
const STATUS_LABEL = { proposed: 'proposed', approved: 'approved', rejected: 'rejected', deployed: 'deployed', measured: 'measured', rolled_back: 'rolled back' }

function sparkline(values, deployedAt) {
  const pts = values.map((v, i) => ({ v, i })).filter((p) => p.v != null)
  if (pts.length < 1) return ''
  const W = 280, H = 34, n = Math.max(values.length - 1, 1)
  const x = (i) => 4 + (W - 8) * (i / n)
  const y = (v) => H - 4 - (H - 8) * (Math.min(100, Math.max(0, v)) / 100)
  const line = pts.map((p) => `${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ')
  const marks = (deployedAt || []).map((i) => `<line x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="2" y2="${H - 2}" stroke="var(--active)" stroke-dasharray="2 2"/>`).join('')
  const dots = pts.map((p) => `<circle cx="${x(p.i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="2.5" fill="var(--text)"><title>${esc(String(p.v))}</title></circle>`).join('')
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${marks}<polyline points="${line}" fill="none" stroke="var(--muted)" stroke-width="1.5"/>${dots}</svg>`
}

function trendChart(cycles, deployedCycles) {
  const W = 420, H = 110, pad = 14
  const vals = cycles.map((c) => c.overall)
  const n = Math.max(cycles.length - 1, 1)
  const x = (i) => pad + (W - 2 * pad) * (i / n)
  const y = (v) => H - pad - (H - 2 * pad) * (Math.min(100, Math.max(0, v)) / 100)
  const pts = vals.map((v, i) => ({ v, i })).filter((p) => p.v != null)
  const marks = cycles.map((c, i) => deployedCycles.has(c.cycle) ? `<line x1="${x(i)}" x2="${x(i)}" y1="${pad - 4}" y2="${H - pad}" stroke="var(--active)" stroke-dasharray="3 3"><title>a change was approved after ${esc(c.cycle)}</title></line>` : '').join('')
  const grid = [50, 70, 85].map((g) => `<line x1="${pad}" x2="${W - pad}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/><text x="${W - pad}" y="${y(g) - 2}" fill="var(--faint)" font-size="8" text-anchor="end">${g}</text>`).join('')
  const line = pts.length > 1 ? `<polyline points="${pts.map((p) => `${x(p.i)},${y(p.v)}`).join(' ')}" fill="none" stroke="var(--pass)" stroke-width="2"/>` : ''
  const dots = pts.map((p) => `<circle cx="${x(p.i)}" cy="${y(p.v)}" r="3.5" fill="var(--pass)"><title>${esc(cycles[p.i].cycle)}: ${esc(String(p.v))}</title></circle><text x="${x(p.i)}" y="${H - 2}" fill="var(--faint)" font-size="8" text-anchor="middle">${esc(cycles[p.i].cycle)}</text>`).join('')
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Overall confidence per cycle">${grid}${marks}${line}${dots}</svg>`
}

function diffHtml(diff) {
  return esc(diff || '(no text change: baseline)').split('\n').map((l) => l.startsWith('+') && !l.startsWith('+++') ? `<span class="add">${l}</span>` : l.startsWith('-') && !l.startsWith('---') ? `<span class="del">${l}</span>` : l).join('\n')
}

function skillCard(id, sk, audit, cycles) {
  const changes = audit.filter((a) => a.skill === id)
  const name = skillName(id)
  const series = id.startsWith('agent:') ? cycles.map((c) => c.agents?.[name]?.confidence ?? null) : cycles.map((c) => c.overall)
  const deployedAt = cycles.map((c, i) => changes.some((a) => a.cycle === c.cycle && a.version) ? i : -1).filter((i) => i >= 0)
  const chips = sk.versions.map((v) => {
    const key = `${id}@${v.version}`
    return `<button class="vchip ${esc(v.kind)} ${openVersions.has(key) ? 'on' : ''}" data-version="${esc(key)}" title="${esc(v.kind)} · ${esc((v.date || '').slice(0, 10))}">v${esc(v.version)}</button>`
  }).join('')
  const open = sk.versions.filter((v) => openVersions.has(`${id}@${v.version}`)).map((v) => {
    const gap = v.gap && (v.gap.summary || v.gap)
    const ch = changes.find((a) => a.version === v.version)
    const verdict = ch?.verdict ? `<br>measured: <b>${esc(ch.verdict.replace('_', ' '))}</b>${ch.measure && ch.measure.before != null ? ` (${esc(String(ch.measure.before))} → ${esc(String(ch.measure.after))}, n=${esc(String(ch.measure.n_after))})` : ''}` : ''
    return `<div class="evo-detail"><b>v${esc(v.version)}</b> · ${esc(v.kind)} · ${esc((v.date || '').slice(0, 10))}${v.cycle ? ' · cycle ' + esc(v.cycle) : ''}${v.approved_by ? ' · approved by ' + esc(v.approved_by) : ''}` +
      `${gap ? `<br>gap: ${esc(String(gap))}` : ''}${v.rolled_back_to ? `<br>restores v${esc(v.rolled_back_to)}${v.reason ? ': ' + esc(v.reason) : ''}` : ''}` +
      `${v.expected_effect ? `<br>expected: ${esc(v.expected_effect.criterion)} ${esc(v.expected_effect.direction)} ${esc(String(v.expected_effect.delta))}` : ''}${verdict}<pre>${diffHtml(v.diff)}</pre></div>`
  }).join('')
  return `<article class="evo-skill"><div class="ag-top"><span class="ag-name">${esc(name)}</span><span class="ver">v${esc(sk.current)}</span></div>
    <div class="evo-line">${chips}</div>${sparkline(series, deployedAt)}${open}</article>`
}

function auditRow(a) {
  const stages = a.stages.map((s) => {
    const label = s.event === 'measured' ? s.verdict : s.event
    const tip = [s.ts, s.by && 'by ' + s.by, s.reason, s.version && 'v' + s.version].filter(Boolean).join(' · ')
    return `<span class="stg ${esc(label)}" title="${esc(tip)}">${esc(STATUS_LABEL[label] || label.replace('_', ' '))}${s.event === 'rejected' && s.reason ? ': ' + esc(s.reason) : ''}</span>`
  }).join('')
  const ei = a.expected_impact
  return `<div class="evo-row"><span>${esc(a.cycle)}/${esc(a.change)}</span><span>${esc(skillName(a.skill))}${a.version ? ' → v' + esc(a.version) : ''}</span>
    <span class="sum">${esc(a.summary || '')}<br><span style="color:var(--faint)">${esc(a.priority || '')} · ${esc(a.confidence || '')}${ei ? ` · expects ${esc(ei.criterion)} ${esc(ei.direction)} ${esc(String(ei.delta))}` : ''}</span></span>
    <span class="stages">${stages}</span></div>`
}

// ---- Cost spread: step and agent -------------------------------------------
const STEPS = [
  ['intake', 'Intake', '#8be9fd'], ['spec', 'Spec', '#bd93f9'], ['build', 'Build', '#50fa7b'],
  ['review', 'Review', '#ffb86c'], ['approve', 'Approve', '#ff79c6'],
  ['orchestration', 'Orchestration', '#f1fa8c'], ['other', 'Other', '#6272a4'],
]
const STEP_OF = { intake: 'intake', 'spec-writer': 'spec', builder: 'build', approver: 'approve', orchestrator: 'orchestration' }
const stepOf = (agent) => agent.startsWith('reviewer-') ? 'review' : (STEP_OF[agent] || 'other')
const agentLabel = (agent) => agent.replace(/^reviewer-/, '')
const money = (c) => (c > 0 && c < 0.01) ? `$${c.toFixed(3)}` : `$${c.toFixed(2)}`

// Cumulative cost of some jobs: { total, steps: { step: { total, agents: { agent: usd } } } }.
// A job with no per-agent figures (older jobs) goes under "other" so the lane total still adds up.
function costSpread(list) {
  const steps = {}
  let total = 0
  const add = (agent, usd) => {
    const st = stepOf(agent)
    steps[st] = steps[st] || { total: 0, agents: {} }
    steps[st].total += usd
    steps[st].agents[agent] = (steps[st].agents[agent] || 0) + usd
  }
  for (const j of list) {
    const by = j.cost_by_agent || {}
    let sum = 0
    for (const [agent, usd] of Object.entries(by)) { add(agent, Number(usd)); sum += Number(usd) }
    const rest = Number(j.cost_usd) - sum
    if (rest > 0.0005) add('unattributed', rest)
    total += Number(j.cost_usd)
  }
  return { total, steps }
}

function costHtml(list) {
  const { total, steps } = costSpread(list)
  if (!(total > 0)) return '<div class="cost"><span class="costnone">No cost recorded yet</span></div>'
  const used = STEPS.filter(([id]) => steps[id])
  const bar = used.map(([id, label, color]) => {
    const pct = 100 * steps[id].total / total
    return `<i style="width:${pct.toFixed(2)}%;background:${color}" title="${esc(label)} ${money(steps[id].total)} (${pct.toFixed(0)}%)"></i>`
  }).join('')
  const legend = used.map(([id, label, color]) => {
    const agents = Object.entries(steps[id].agents).sort((a, b) => b[1] - a[1])
      .map(([a, c]) => `${esc(agentLabel(a))} ${money(c).slice(1)}`).join(' · ')
    return `<span class="it"><span class="sw" style="background:${color}"></span>${esc(label)} <b>${money(steps[id].total)}</b><span class="ag">${agents}</span></span>`
  }).join('')
  return `<div class="cost"><div class="costbar">${bar}</div><div class="costlegend">${legend}</div></div>`
}

function laneHtml(name, laneJobs, byJob, unknown) {
  const closed = closedLanes.has(name)
  const repo = targets[name]?.repo
  const count = (f) => laneJobs.filter(f).length
  const needsHuman = count((j) => j.stage === 'needs-human')
  const running = count((j) => LIVE.has(j.stage))
  const merged = count((j) => j.stage === 'merged')
  const cost = laneJobs.reduce((sum, j) => sum + Number(j.cost_usd), 0)
  const cols = COLUMNS.map((c) => {
    let cards = laneJobs.filter((j) => c.stages.includes(j.stage)).map((j) => byJob.get(j.id)).reverse()
    let more = ''
    if (c.cls === 'merged-col' && cards.length > DONE_LIMIT) {
      const all = showAllDone.has(name)
      const hidden = cards.length - DONE_LIMIT
      more = `<button class="more" type="button" data-done="${esc(name)}">${all ? 'Show only the latest ' + DONE_LIMIT : 'Show ' + hidden + ' older'}</button>`
      if (!all) cards = cards.slice(0, DONE_LIMIT)
    }
    return `<section class="col ${c.cls || ''}">${columnHead(c)}${cards.join('') || '<div class="empty">—</div>'}${more}</section>`
  }).join('')
  const empty = `<div class="lane-empty">No jobs yet. Label an issue of this project <code>factory</code> and run /factory run ${esc(name)}.</div>`
  return `
    <section class="lane ${closed ? 'closed' : ''} ${unknown ? 'unknown' : ''}" data-lane="${esc(name)}">
      <div class="lane-head" role="button" tabindex="0" aria-expanded="${!closed}" data-toggle="${esc(name)}">
        <span class="caret">▾</span>
        <span class="name">${esc(unknown ? name + ' (unknown target)' : name)}</span>
        ${repo ? `<a class="repo" href="https://github.com/${esc(repo)}" target="_blank" rel="noopener" title="Open ${esc(repo)} on GitHub">${esc(repo)} ↗</a>` : ''}
        <span class="stats">
          <span>${running} running</span>
          <span class="${needsHuman ? 'alert' : ''}">${needsHuman} needs human</span>
          <span>${merged} merged</span>
          <span>${money(cost)}</span>
        </span>
      </div>
      ${costHtml(laneJobs)}
      ${laneJobs.length ? `<div class="board">${cols}</div>` : empty}
    </section>`
}

async function render() {
  const problems = []
  const byJob = new Map()
  for (const job of jobs) {
    if (!STAGES.has(job.stage)) { problems.push(`Job ${job.id} has unknown stage "${job.stage}"`); continue }
    const rounds = []
    for (let n = 1; n <= job.round; n++) rounds.push(roundRow(job, n, await roundVerdicts(job, n)))
    byJob.set(job.id, card(job, rounds))
  }
  const valid = jobs.filter((j) => byJob.has(j.id))
  const laneOf = (j) => j.target || '?'
  const known = Object.keys(targets)
  const unknown = [...new Set(valid.map(laneOf))].filter((t) => !known.includes(t))
  for (const t of unknown) problems.push(`Jobs reference target "${t}", which isn't in config.json targets`)
  const names = [...known, ...unknown]
  if (onlyLane && !names.includes(onlyLane)) onlyLane = null
  const shown = names.filter((n) => !onlyLane || n === onlyLane)

  const chips = [`<button class="fchip" type="button" data-only="" aria-pressed="${!onlyLane}">All</button>`]
    .concat(names.map((n) => {
      const mine = valid.filter((j) => laneOf(j) === n)
      const h = mine.filter((j) => j.stage === 'needs-human').length
      return `<button class="fchip ${h ? 'alert' : ''}" type="button" data-only="${esc(n)}" aria-pressed="${onlyLane === n}">${esc(n)}<span class="n">${h ? h + ' ⚑' : mine.length}</span></button>`
    })).join('')
  const lanes = shown.map((n) =>
    laneHtml(n, valid.filter((j) => laneOf(j) === n), byJob, unknown.includes(n))).join('')
    || '<div class="lane-empty">No targets yet. Add one: factory/bin/target add &lt;name&gt; &lt;owner/repo&gt;</div>'
  const banner = problems.map((p) => `<div class="banner">${esc(p)}</div>`).join('')
  const html = chips + lanes + banner
  if (html !== lastRender) {
    lastRender = html
    $('filters').innerHTML = chips
    $('lanes').innerHTML = lanes
    $('colhead').innerHTML = COLUMNS.map(columnHead).join('')
    $('banner').innerHTML = banner
  }
  // Tab title and notifications: how many jobs are waiting for the user.
  const waiting = valid.filter((j) => j.stage === 'needs-human')
  document.title = (waiting.length ? `(${waiting.length}) ` : '') + 'Software Factory'
  const ids = new Set(waiting.map((j) => j.id))
  if (knownHuman && notifyOn) {
    for (const j of waiting) {
      if (!knownHuman.has(j.id)) {
        try {
          const n = new Notification(`${j.target ? j.target + ' · ' : ''}${j.id} needs you`, { body: j.title })
          const url = j.pr_url || j.issue_url // a click opens the PR to merge, or the issue
          if (url) n.onclick = () => window.open(url, '_blank', 'noopener')
        } catch { /* ignored */ }
      }
    }
  }
  knownHuman = ids
  const running = valid.filter((j) => LIVE.has(j.stage)).length
  const cost = valid.reduce((sum, j) => sum + Number(j.cost_usd), 0)
  $('totals').textContent = `${running} running · ${money(cost)} API-equivalent` +
    (overhead > 0 ? ` · + ${money(overhead)} orchestration outside any job` : '')
}

const notifyBtn = $('notify')
if (typeof Notification !== 'undefined') {
  notifyBtn.hidden = false
  notifyBtn.setAttribute('aria-pressed', String(notifyOn))
  notifyBtn.addEventListener('click', async () => {
    if (notifyOn) { notifyOn = false } else {
      let perm = Notification.permission
      if (perm === 'default') perm = await Notification.requestPermission()
      notifyOn = perm === 'granted'
    }
    store.set('notify', notifyOn)
    notifyBtn.setAttribute('aria-pressed', String(notifyOn))
  })
}

document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.lane-head')) { e.preventDefault(); e.target.click() }
})

document.addEventListener('click', (e) => {
  if (e.target.closest('.lane-head a')) return // a link inside the header opens GitHub, it doesn't collapse the lane
  const toggle = e.target.closest('[data-toggle]')
  if (toggle) {
    const n = toggle.dataset.toggle
    closedLanes.has(n) ? closedLanes.delete(n) : closedLanes.add(n)
    store.set('closed', [...closedLanes]); lastRender = ''; render()
    return
  }
  const done = e.target.closest('[data-done]')
  if (done) {
    const n = done.dataset.done
    showAllDone.has(n) ? showAllDone.delete(n) : showAllDone.add(n)
    store.set('allDone', [...showAllDone]); lastRender = ''; render()
    return
  }
  const only = e.target.closest('[data-only]')
  if (only) { onlyLane = only.dataset.only || null; store.set('only', onlyLane); lastRender = ''; render() }
})

async function poll() {
  const status = $('status')
  try {
    jobs = await loadJobs()
    try { targets = JSON.parse(await fetchText('config.json')).targets || {} } catch { /* lanes then come from the jobs alone */ }
    try { overhead = Number(JSON.parse(await fetchText('jobs/_orchestration.json')).outside_jobs_usd) || 0 } catch { overhead = 0 }
    try { scores = JSON.parse(await fetchText('evals/scores.json')) } catch { scores = null }
    try { board = JSON.parse(await fetchText('evolution/board.json')) } catch { board = null }
    try { metrics = JSON.parse(await fetchText('metrics.json')) } catch { metrics = null }
    renderHealth()
    renderAgents()
    renderEvolution()
    await render()
    if (openJobId) await refreshDrawer()
    status.className = 'status'
    status.innerHTML = `<span class="dot"></span>jobs/ · ${new Date().toLocaleTimeString()}`
  } catch (err) {
    status.className = 'status error'
    status.innerHTML = `<span class="dot"></span>${esc(err.message)}`
  }
}

// factory/bin/job writes each jobs/<id>/job.json.
async function loadJobs() {
  let listing
  try { listing = await fetchText('jobs/') } catch { return [] }
  const doc = new DOMParser().parseFromString(listing, 'text/html')
  const ids = [...doc.querySelectorAll('a')]
    .map((a) => decodeURIComponent(a.getAttribute('href')))
    .filter((h) => h.endsWith('/'))
    .map((h) => h.slice(0, -1))
    .sort()
  return Promise.all(ids.map(async (id) => JSON.parse(await fetchText(`jobs/${id}/job.json`))))
}

// ---- Drawer --------------------------------------------------------------

// python -m http.server serves an HTML index for directories; read its links.
async function listFiles(dir) {
  const doc = new DOMParser().parseFromString(await fetchText(dir), 'text/html')
  const hrefs = [...doc.querySelectorAll('a')].map((a) => decodeURIComponent(a.getAttribute('href')))
  const out = []
  for (const h of hrefs) {
    if (h.endsWith('/')) out.push(...(await listFiles(dir + h)).map((f) => h + f))
    else if (h.endsWith('.md')) out.push(h)
  }
  return out
}

const ORDER = ['issue.md', 'intake.md', 'spec.md', 'build.md', 'decision.md', 'rejection.md']
const ROUND_ORDER = ['checks', 'review-code', 'review-security', 'review-ux', 'review-ui', 'merge-checks']

function fileRank(path) {
  if (ORDER.includes(path)) return [0, ORDER.indexOf(path), path]
  const round = path.match(/^round-(\d+)\/(.+)\.md$/)
  if (round) return [2, Number(round[1]) * 10 + ROUND_ORDER.indexOf(round[2]), path]
  return [1, 0, path] // intake-<k>.md, feedback-<k>.md
}

function sortFiles(files) {
  return files.sort((a, b) => {
    const [x, y] = [fileRank(a), fileRank(b)]
    return x[0] - y[0] || x[1] - y[1] || x[2].localeCompare(y[2])
  })
}

function tone(first) {
  if (/^(VERDICT:\s*PASS|GATE:\s*PASS|APPROVE|STATUS:\s*READY|DECISION:\s*ACCEPT)$/.test(first)) return 'good'
  if (/^(VERDICT:\s*CHANGES|DECISION:\s*NEEDS-INFO)$/.test(first)) return 'warn'
  if (/^(ESCALATE|REJECTED|STATUS:\s*BLOCKED|GATE:\s*FAIL|DECISION:\s*REJECT)$/.test(first)) return 'stop'
  return null
}

const firstLines = new Map()

async function refreshDrawer() {
  const job = jobs.find((j) => j.id === openJobId)
  if (!job) return
  $('d-num').textContent = `${job.target ? job.target + ' · ' : ''}${job.id} · ${job.stage}${job.round ? ` · round ${job.round}` : ''} · ${money(Number(job.cost_usd))} · ${elapsed(job)}`
  $('d-title').textContent = job.title
  $('d-links').innerHTML = links(job)

  const base = `jobs/${job.id}/`
  const files = sortFiles(await listFiles(base))
  if (!openPath || !files.includes(openPath)) openPath = files[0] || null

  let text = null
  if (openPath) {
    text = await fetchText(base + openPath)
    firstLines.set(base + openPath, text.split('\n')[0].trim())
  }
  await Promise.all(files.filter((f) => !firstLines.has(base + f)).map(async (f) => {
    firstLines.set(base + f, (await fetchText(base + f)).split('\n')[0].trim())
  }))

  let group = null
  $('d-files').innerHTML = files.map((f) => {
    const g = f.includes('/') ? f.split('/')[0].replace('round-', 'Round ') : 'Job'
    const head = g !== group ? `<div class="group">${esc(g)}</div>` : ''
    group = g
    const round = f.match(/^round-(\d+)\//)
    const name = round
      ? `<span class="rn">R${round[1]} </span>${esc(f.split('/')[1].replace(/^review-|\.md$/g, ''))}`
      : esc(f)
    const t = tone(firstLines.get(base + f) || '')
    return `${head}<button class="file ${f === openPath ? 'on' : ''}" data-file="${esc(f)}">
      <span class="v ${t || ''}"></span>${name}</button>`
  }).join('') || '<div class="empty">No files yet.</div>'

  if (text !== openText) {
    openText = text
    $('d-doc').innerHTML = text === null ? '<p class="note">Intake hasn’t written anything yet.</p>' : markdown(text)
  }
}

async function openDrawer(id) {
  openJobId = id
  openPath = null
  openText = undefined
  document.body.classList.add('open')
  try {
    await refreshDrawer()
  } catch (err) {
    $('d-doc').innerHTML = `<p class="note">${esc(err.message)}</p>`
  }
}

function closeDrawer() {
  openJobId = null
  document.body.classList.remove('open')
}

document.addEventListener('click', (e) => {
  if (e.target.closest('a')) return
  const cardEl = e.target.closest('[data-job]')
  if (cardEl) return openDrawer(cardEl.dataset.job)
  const fileEl = e.target.closest('[data-file]')
  if (fileEl) {
    openPath = fileEl.dataset.file
    openText = undefined
    $('d-doc').parentElement.scrollTop = 0
    return refreshDrawer()
  }
  if (e.target.closest('[data-close]')) closeDrawer()
})
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') return closeDrawer()
  const cardEl = e.target.closest?.('[data-job]')
  if (cardEl && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openDrawer(cardEl.dataset.job) }
})

// ---- Markdown (just enough for the factory's files) ---------------------

function inline(s) {
  const codes = []
  s = esc(s).replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`)
  s = s
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(((?:https?:\/\/|\.{0,2}\/|#)[^)\s]*)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`)
}

// Every step's file has a `## Summary` of a few bullets; show it first, in a box.
function splitSummary(lines) {
  const start = lines.findIndex((l) => /^##\s+Summary\s*$/.test(l))
  if (start === -1) return { lines, summary: null }
  let end = start + 1
  while (end < lines.length && !/^#{1,2}\s/.test(lines[end])) end++
  return {
    lines: [...lines.slice(0, start), ...lines.slice(end)],
    summary: lines.slice(start + 1, end).join('\n'),
  }
}

function markdown(src) {
  const split = splitSummary(src.replace(/\r/g, '').split('\n'))
  const lines = split.lines
  let i = 0
  let html = ''
  const first = (lines[0] || '').trim()
  const t = tone(first)
  if (t) {
    html += `<div class="verdict ${t}">${esc(first)}</div>`
    i = 1
    // The rest of a KEY: value header block (intake.md, checks.md).
    const extra = []
    while (i < lines.length && /^[A-Z-]+:\s/.test(lines[i])) extra.push(lines[i++])
    if (extra.length) html += `<div class="head">${esc(extra.join('\n'))}</div>`
  }
  if (split.summary !== null) html += `<section class="summary"><h2>Summary</h2>${markdown(split.summary)}</section>`

  const isList = (l) => /^\s*([-*+]|\d+\.)\s+/.test(l)
  const isBlockStart = (l) => /^(#{1,6}\s|```|\s*>|\|)/.test(l) || isList(l)

  while (i < lines.length) {
    const line = lines[i]
    if (!line.trim()) { i++; continue }

    if (line.startsWith('```')) {
      const body = []
      i++
      while (i < lines.length && !lines[i].startsWith('```')) body.push(lines[i++])
      i++
      html += `<pre><code>${esc(body.join('\n'))}</code></pre>`
      continue
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/)
    if (h) { const n = Math.min(h[1].length, 4); html += `<h${n}>${inline(h[2])}</h${n}>`; i++; continue }

    if (/^\s*>/.test(line)) {
      const body = []
      while (i < lines.length && /^\s*>/.test(lines[i])) body.push(lines[i++].replace(/^\s*>\s?/, ''))
      html += `<blockquote>${markdown(body.join('\n'))}</blockquote>`
      continue
    }
    if (line.startsWith('|')) {
      const rows = []
      while (i < lines.length && lines[i].startsWith('|')) rows.push(lines[i++])
      const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()))
      const body = rows.filter((r) => !/^\|[\s:|-]+\|$/.test(r))
      html += '<table>' + body.map((r, n) => `<tr>${cells(r).map((c) => n ? `<td>${c}</td>` : `<th>${c}</th>`).join('')}</tr>`).join('') + '</table>'
      continue
    }
    if (isList(line)) {
      const ordered = /^\s*\d+\./.test(line)
      const items = []
      while (i < lines.length && (isList(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        const l = lines[i++]
        if (isList(l)) items.push({ indent: l.match(/^\s*/)[0].length, text: l.replace(/^\s*([-*+]|\d+\.)\s+/, '') })
        else items[items.length - 1].text += ' ' + l.trim()
      }
      const lis = items.map(({ indent, text }) => {
        const task = text.match(/^\[([ xX])\]\s+(.*)$/)
        const style = indent ? ` style="margin-left:${indent * 0.6}em"` : ''
        return task
          ? `<li class="task ${task[1] === ' ' ? '' : 'done'}"${style}>${inline(task[2])}</li>`
          : `<li${style}>${inline(text)}</li>`
      }).join('')
      html += ordered ? `<ol>${lis}</ol>` : `<ul>${lis}</ul>`
      continue
    }
    const para = []
    while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) para.push(lines[i++])
    html += `<p>${inline(para.join(' '))}</p>`
  }
  return html
}
